# Supabase CLI configuration
#
# NOTE on project_id: this value is infrastructure reconnaissance data and would
# ideally not be tracked. It is kept because the Supabase CLI needs it for
# `supabase link` / `supabase db push`, and removing it would break deploys.
#
# Removing it would NOT actually protect anything: the same project ref is
# embedded as the `ref` claim inside the anon key JWT that was committed in
# 6eda9cc and is therefore permanent in git history. The real remediation is
# ROTATION (see wrangler.toml), not redaction. If you do move this to an
# untracked override, pass `--project-ref` explicitly to every CLI invocation.
project_id = "eqrhjmuaaaarjxuprjaj"

# Edge function defaults
# The signup function is called from the app with no Authorization header
# (users must be able to create an account before they have a JWT), so it must
# be deployed with JWT verification disabled. The function validates the
# payload itself. Abuse controls (CAPTCHA / rate limits) must be enforced in
# the Supabase Auth dashboard since this endpoint is intentionally public.
[functions.signup]
verify_jwt = false

[functions.sync-external-data]
verify_jwt = false

# Authenticated-only: the gateway rejects missing/invalid JWTs, and the
# function additionally verifies the user JWT itself.
[functions.geocode]
verify_jwt = true

[functions.send-notification]
verify_jwt = true

# Internal cron job: gateway JWT check ON (no anonymous calls), plus the
# function requires the x-job-secret header (see STATS_JOB_SECRET).
[functions.update-user-stats]
verify_jwt = true
