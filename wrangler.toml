# Cloudflare Pages configuration
# https://developers.cloudflare.com/pages/
# NOTE: Pages wrangler.toml does NOT support a [build] section.
# Build command (in the Cloudflare Pages dashboard, Settings > Build):
#   npm run build:web
# (It runs scripts/check-web-env.mjs first so a build without the
# required EXPO_PUBLIC_* env vars fails instead of shipping a broken bundle.)
#
# Build-time variables live in [vars] below. Cloudflare's Pages builder reads
# them via "wrangler pages functions build-env" BEFORE the build command runs
# and reports them in the build log as "Build environment variables".
# Settings > Environment variables (named "Variables and Secrets" in the
# current dashboard) is not reliably injected into builds, so the values must
# live here (see cloudflare-docs issue #30714).
#
# These values are inlined into the public JS bundle by Expo, so they are NOT
# secrets: never put a service-role key or any real secret in this file.
# Changing them requires a rebuild.

name = "pulse"
compatibility_date = "2026-09-15"
pages_build_output_dir = "dist"

