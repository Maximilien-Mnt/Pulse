# Cloudflare Pages configuration
# https://developers.cloudflare.com/pages/
# NOTE: Pages wrangler.toml does NOT support a [build] section.
# Build command (in the Cloudflare Pages dashboard, Settings > Build):
#   npm run build:web
# (It runs scripts/check-web-env.mjs first so a build without the
# required EXPO_PUBLIC_* env vars fails instead of shipping a broken bundle.)
#
# ---------------------------------------------------------------------------
# WHERE THE BUILD VARIABLES LIVE
# ---------------------------------------------------------------------------
# Build vars are NOT in this file (Pages ignores [vars] at build time, and
# this repo is public). Set them in the dashboard:
#   Cloudflare Pages > pulse > Settings > Variables and Secrets
#   > Production AND Preview:
#     EXPO_PUBLIC_SUPABASE_URL / EXPO_PUBLIC_SUPABASE_ANON_KEY (required)
#     POSTHOG_PROJECT_TOKEN / POSTHOG_HOST / EXPO_PUBLIC_APP_SCHEME (optional)
# Changing any of these requires a rebuild (Expo inlines them). If the build
# still reports "missing environment variables", the dashboard vars were not
# injected — re-save them and hit Retry deployment.
#
# History note: a [vars] block with the live Supabase URL + anon key was
# committed in 6eda9cc and later removed. Treat that key as exposed: fix RLS
# gaps first (supabase/migrations/059), then rotate the JWT secret in the
# Supabase dashboard, redeploy web, and ship an app update. Also rotate the
# PostHog token. Never commit supabase/.temp/ contents.
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# BOT PROTECTION (Cloudflare) — configure in the Cloudflare dashboard, not
# in this file (Pages ignores [vars] at build time):
#
# 1. Turnstile: create a site at dash.cloudflare.com → Turnstile.
#    Set EXPO_PUBLIC_CLOUDFLARE_TURNSTILE_SITE_KEY (public) and
#    CLOUDFLARE_TURNSTILE_SECRET_KEY (server-only, Supabase Edge Function
#    env var) in the respective dashboards.
#
# 2. WAF Bot Fight Mode: enable for the zone.
#
# 3. WAF custom rules (Security → WAF → Create rule):
#    a) Path contains "/auth/signin" → Rate limit: 10 req/60s per IP,
#       action: Challenge (managed CAPTCHA).
#    b) Path contains "/functions/v1/signup" → Rate limit: 5 req/60s per IP,
#       action: Block.
#    c) Bot management score <= 30 on auth/signup paths → Challenge.
#
# 4. Supabase Dashboard → Authentication → Rate limiting:
#    - Signup: max 3/hr per IP, max 3/hr per email
#    - Signin: max 10/hr per IP, max 5/hr per email
#    - Password reset / OTP: max 3/hr per IP per email
#    - Enable email confirmation + password leak detection.
# ---------------------------------------------------------------------------

name = "pulse"
# Pinned to the date this configuration was last reviewed, per Cloudflare's
# compatibility-date policy. Bump deliberately when upgrading the Workers
# runtime behaviour, not as part of an unrelated change.
compatibility_date = "2026-09-15"
pages_build_output_dir = "dist"

# ---------------------------------------------------------------------------
# BUILD REPRODUCIBILITY
# ---------------------------------------------------------------------------
# Pages has no [build] section, so the command and Node version live in the
# Cloudflare dashboard (Settings > Build). Keep them in sync with CI:
#
#   Build command:            npm run build:web
#   Build system version:     Node 22   (matches .github/workflows/ci.yml and
#                                     netlify.toml)
#
# Do NOT use `npx expo export --platform web` here. `npx` falls back to the
# registry when the local binary does not satisfy the request, which bypasses
# package-lock.json and can ship a different `expo` than CI tested.
# `npm run build:web` runs scripts/check-web-env.mjs first, so a build without
# the required EXPO_PUBLIC_* vars fails instead of shipping a broken bundle.
# ---------------------------------------------------------------------------

