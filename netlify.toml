[build]
  command = "bash -c 'test -n \"$EXPO_PUBLIC_SUPABASE_URL\" && test -n \"$EXPO_PUBLIC_SUPABASE_ANON_KEY\" || { echo \"ERROR: EXPO_PUBLIC_SUPABASE_URL and EXPO_PUBLIC_SUPABASE_ANON_KEY must be set (Netlify Site settings > Environment variables) — they are inlined at build time.\"; exit 1; }; npx expo export --platform web'"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"